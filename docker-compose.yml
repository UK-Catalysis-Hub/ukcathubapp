version: "3.9"

services:

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web

  web:
    image: cdp-app
#    ports:
#      - "80:3000"
    env_file:
      - .env
    volumes:
      - storage_data:/rails/storage
    depends_on:
      - redis

  sidekiq:
    image: cdp-app
    env_file:
      .env
    volumes:
      - storage_data:/rails/storage
    depends_on:
      - redis
    command: bundle exec sidekiq

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  storage_data:

