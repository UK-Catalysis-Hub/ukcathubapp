services:

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_production
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

  web:
    build: .
    image: cdp-app
    env_file:
      - .env
    volumes:
      - storage_data:/rails/storage
    depends_on:
      - redis

  sidekiq:
    build: .
    image: cdp-app
    env_file:
      .env
    volumes:
      - storage_data:/rails/storage
    depends_on:
      - redis
    command: bundle exec sidekiq

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  storage_data:

