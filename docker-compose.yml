services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${DATABASE_PROD}
    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${DATABASE_PROD}"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

  web:
    build: .
    image: cdp-app
    env_file:
      - .env
    volumes:
      - storage_data:/rails/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  sidekiq:
    build: .
    image: cdp-app
    env_file:
      .env
    volumes:
      - storage_data:/rails/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: bundle exec sidekiq

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  storage_data:
  postgres_data:
